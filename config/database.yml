default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: conecta_development
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

test:
  <<: *default
  database: conecta_test
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

production:
  primary: &primary_production
    <<: *default
    database: conecta_production
    username: conecta
    password: <%= ENV["CONECTA_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: conecta_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: conecta_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: conecta_production_cable
    migrations_paths: db/cable_migrate
